<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #333;
    }

    header {
      background: #2ecc71;
      padding: 15px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    header h1 {
      font-size: 24px;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(to right, #27ae60, #2ecc71);
      color: white;
      flex-direction: column;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .hero button {
      padding: 10px 20px;
      border: none;
      background: white;
      color: #2ecc71;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }

    .section {
      padding: 50px;
      text-align: center;
    }

    .cards {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      width: 250px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>MySite</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <div class="hero">
    <h2>Welcome to My Website</h2>
    <p>Create something amazing 🚀</p>
    <button>Get Started</button>
  </div>

  <!-- Services Section -->
  <div class="section">
    <h2>Our Services</h2>
    <div class="cards">
      <div class="card">
        <h3>Web Development</h3>
        <p>Modern and responsive websites</p>
      </div>
      <div class="card">
        <h3>App Development</h3>
        <p>Android & iOS applications</p>
      </div>
      <div class="card">
        <h3>AI Solutions</h3>
        <p>Smart AI-based systems</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 MySite | All Rights Reserved</p>
  </footer>

</body>
</html>
