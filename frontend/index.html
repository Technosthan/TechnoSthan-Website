<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/itfavicon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technosthan IT Services</title>
    <script>
      (function () {
        try {
          var key = "technosthan-theme-v3";
          var legacyKey = "technosthan-theme-v2";
          var raw = localStorage.getItem(key) || localStorage.getItem(legacyKey);
          var accent = "orange";
          var mode = "dark";

          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object") {
              if (parsed.accentTheme || parsed.family) {
                accent = String(parsed.accentTheme || parsed.family).toLowerCase();
              }
              if (parsed.modeSetting === "light" || parsed.mode === "light") mode = "light";
              if (parsed.modeSetting === "system") {
                mode = window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                  ? "light"
                  : "dark";
              }
            } else if (raw === "light" || raw === "dark") {
              mode = raw;
            }
          }

          document.documentElement.dataset.accent = accent;
          document.documentElement.dataset.themeFamily = accent;
          document.documentElement.dataset.mode = mode;
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
